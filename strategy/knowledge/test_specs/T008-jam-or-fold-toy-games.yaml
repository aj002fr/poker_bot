- name: equity smoothing
  given:
    stack: 3
  expect:
    call_threshold: 3/4
    jam_threshold: 3/4
    value: 1/16
properties:
- >-
  deterministic case matches x = 3/(2(1+S)), y = 3S/(1+S)^2, value -1/2 + 9S/(4(1+S)^2) for S
  in {1, 2, 4, 8}
- smoothed case matches both closed-form branches and is continuous at the branch point
mutations:
- swapping the jammer and caller thresholds must fail
