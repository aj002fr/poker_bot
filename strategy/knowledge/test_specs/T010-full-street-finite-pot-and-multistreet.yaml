schema: knowledge.invariant-test/v1
id: T010
title: Full-street, finite-pot and multistreet toy games
kind: invariant_test
records: [I010]
owner_workstream: M2-A
target: strategy.games fixture registry, solved by strategy.solve (CFR family and ES-MCCFR)
test_location: tests/strategy/test_fixture_gates.py, tests/strategy/test_mutations.py
status: implemented
implemented_by:
- tests/strategy/test_fixture_gates.py::test_fixture_gates
- tests/strategy/test_mutations.py::test_broken_variant_is_caught
primary_metric: fixture_pass
minimum_effect:
  value: 1.0
  unit: pass_fraction
  basis: analytic
partitions:
  fixtures: deterministic
  final_holdout: excluded
cases:
- name: no check-raise full street
  given:
    game: fixture 9
  expect:
    x1: 1/2
    y2: 1/4
    y1: 3/4
    value: 1/8
- name: check-raise full street
  given:
    game: fixture 10
  expect:
    x2: 1/9
    y2: 1/3
    x1: 5/9
    y1: 2/3
    value: 1/9
- name: finite pot with folding
  given:
    pot: 2
  expect:
    y1: 1/2
    x1: 1/3
    x1_star: 2/3
    y0: 5/6
    x0: 8/9
    value: 1/18
- name: static geometric
  given:
    pot: 1
    streets: 2
    stack: 4
  expect:
    growth: 3
    bet_fraction: 1
- name: marked draw
  given:
    game: fixture 13
  expect:
    dead_hand_calls: 1/70
    x_call: 1/7
    isolated_river_answer_rejected: 6/7
properties:
- unilateral regret is checked at every boundary, not only the value
- the trajectory trainer reproduces 1/7 where chained single-street solving gives 6/7
mutations:
- a solver that chains independent street solutions must fail the marked-draw case
