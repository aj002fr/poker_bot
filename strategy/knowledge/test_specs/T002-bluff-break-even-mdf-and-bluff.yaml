schema: knowledge.invariant-test/v1
id: T002
title: Bluff break-even, MDF and bluff-ratio identities
kind: invariant_test
records: [I002]
owner_workstream: M2-C
target: >-
  strategy.math.odds (bluff_break_even, minimum_defense_frequency, bluff_to_value_ratio, bluff_share_of_betting_range,
  semi_bluff_ev, semi_bluff_break_even)
test_location: tests/strategy/math/test_odds.py
status: implemented
implemented_by:
- tests/strategy/math/test_odds.py::test_defence_and_bluff_identities
- tests/strategy/math/test_odds.py::test_clairvoyance_half_street_at_pot_two
- tests/strategy/math/test_odds.py::test_semi_bluff_with_zero_equity_is_a_bluff
- tests/strategy/math/test_odds.py::test_semi_bluff_break_even_is_minimal
- tests/strategy/math/test_odds.py::test_semi_bluff_ev_increases_with_called_equity
primary_metric: fixture_pass
minimum_effect:
  value: 1.0
  unit: pass_fraction
  basis: analytic
partitions:
  fixtures: deterministic
  final_holdout: excluded
cases:
- name: clairvoyance at pot two
  given:
    pot: 2
    bet: 1
  expect:
    bluff_to_value: 1/3
    mdf: 2/3
    bluff_share: 1/4
- name: pot-sized bet
  given:
    pot: 1
    bet: 1
  expect:
    break_even: 1/2
    mdf: 1/2
properties:
- mdf + break_even == 1
- bluff_ev(break_even) == 0
- semi_bluff_ev with zero called equity equals bluff_ev
- >-
  semi_bluff_break_even is the smallest fold rate with non-negative EV, and 0 when the called
  branch is already profitable
mutations:
- using B/P for break-even must fail the clairvoyance case
