primary_metric: fixture_pass
minimum_effect:
  value: 1.0
  unit: pass_fraction
  basis: analytic
partitions:
  fixtures: deterministic
  final_holdout: excluded
cases:
- name: medium stack covered by the leader
  given:
    stacks: [0, 4000, 700, 3000]
    prizes: [50, 30, 20, 0]
    hero: 3
    villain: 0
    villain_committed: 6000
    dead: 300
  expect:
    chip_threshold: 3000/6300
    point_threshold: 0.7322381795
    risk_premium_above: 0.25
- name: short villain all-in
  given:
    note: villain shorter than hero
  expect:
    matched_call: 580
    contested_pot: 1200
properties:
- expected points at q* equal the fold value
- U_lose <= U_fold <= U_win for every legal all-in state
- premium is zero for affine utilities, winner-take-all and two survivors
- relabelling bystanders leaves hero's values unchanged
mutations:
- using chip pot odds as the point threshold must fail the covered-medium-stack case
