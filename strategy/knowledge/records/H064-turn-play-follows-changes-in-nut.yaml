id: H064
title: Turn play follows changes in nut and equity advantage
kind: strategy
status: proposed
cluster: postflop_turn
sources:
- source: gtow-turn-textures
  location: >-
    Turn textures, blanks; Turn textures, draw-completing cards; Turn textures, high-card improvers
  digest_records: [gtow/H07, gtow/H08, gtow/H09]
  transfer_caveat: Heads-up 100bb cash NLHE; positional asymmetries are line-specific.
situation: Turn cards that keep, transfer or broaden the aggressor's advantage.
eligible_opportunity: Turn decision for the flop aggressor.
observable_inputs: [turn_delta_class, nut_advantage, range_advantage, spr, blocker_mask]
training_signals: []
intervention: >-
  Polarise to check-or-large when a blank keeps the nut edge; cut size and frequency only when
  the caller actually gains nut combos; bet more often but smaller when a high card broadly improves
  the aggressor.
baseline: Turn policy without delta features.
mechanism: >-
  Board appearance without range support creates false alarms; polarised strong hands want pot
  growth; thin value needs smaller sizes.
exceptions:
- Shallow SPR, multiway pots, high risk premium, or dual-change cards.
variant_scope:
  transfer: variant_specific
  variants: [nlhe]
  notes: Turn texture classes are NLHE-specific.
