  transfer_caveat: >-
    Toy-game solutions are exact only under their stated assumptions; hold'em charts and the doubling-up
    model do not transfer to an eight-bot points SNG.
situation: Bet sizing and commitment across different chip scales.
eligible_opportunity: Any betting decision.
observable_inputs: [spr, streets_remaining, bet_size_pot_fraction, pot_odds, stack_bb]
