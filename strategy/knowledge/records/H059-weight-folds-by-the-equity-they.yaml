id: H059
title: Weight folds by the equity they give up
kind: strategy
status: proposed
cluster: postflop_flop
sources:
- source: gtow-cbet-sizing
  location: C-bet sizing, fold-equity quality
  digest_records: [gtow/H06]
  transfer_caveat: Heads-up 100bb cash NLHE solver outputs without ICM.
situation: Candidate sizes produce similar raw fold rates.
eligible_opportunity: Bet-size choice between two sizes with similar estimated fold probability.
observable_inputs:
- weighted_denial
- equity_distribution
- all_fold_probability
- marginal_point_value
training_signals: []
intervention: Prefer the larger size only when the extra folds remove material equity or point
  utility.
baseline: Raw fold rate as the denial measure.
mechanism: >-
  Folding a hand with almost no equity gains little; the count of folds is an incomplete measure.
exceptions:
- Strong future leverage not captured by current equity.
variant_scope:
  transfer: family
  variants: [nlhe, short_deck, plo]
  notes: The weighting idea transfers to big-bet games.
