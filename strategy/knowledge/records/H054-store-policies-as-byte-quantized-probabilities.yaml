id: H054
title: Store policies as byte-quantized probabilities
kind: method
status: proposed
cluster: deployment
sources:
- source: pluribus-2019
  location: competition size limit; blueprint design
  digest_records: [cfr/H8]
  transfer_caveat: >-
    Six-max 100bb cash with real-time search far beyond 1 ms and 100 MB; multiplayer strength
    is empirical.
situation: Millions of information-set probabilities must fit one artifact.
eligible_opportunity: Every stored policy row.
observable_inputs: [policy_table_key, policy_distribution]
training_signals: [teacher_distribution]
intervention: Store each row as unsigned bytes summing to 255, with sparse int8 response deltas.
baseline: Float32 probabilities.
mechanism: About fourfold smaller storage and faster lookup with little loss.
exceptions:
- >-
  Tiny-probability actions can disappear; renormalisation and illegal-action masking magnify error.
