intervention: >-
  Environment and per-seat policy RNG streams are separate, so a policy that consumes more randomness
  does not change the deal; an identical-policy A/B gives intervals covering zero at the nominal
  rate.
baseline: Shared RNG stream.
mechanism: Common random numbers only remove luck if the deal is unchanged by policy actions.
