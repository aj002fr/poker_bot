id: H008
title: Correct forced-bet pressure for orbit length and table size
kind: strategy
status: proposed
cluster: stack_pressure
sources:
- source: mit-15s50
  location: Lectures 5-6; Lecture 1 ~25:31-28:56; slide p. 48; Lectures 1-2
  digest_records: [mit-l56/H7, mit15s50/H01, mit-l12/H1]
  transfer_caveat: >-
    Hold'em charts, M zones and cash-game statistics are examples; Lecture 4 explicitly ignores
    ICM.
situation: Unopened pots as forced bets grow relative to stacks, especially three- to five-handed.
eligible_opportunity: First-in decision in an unopened pot.
observable_inputs:
- m_ratio
- stack_bb
- effective_stack_by_opponent
- players_remaining
- forced_bets
- projected_forced_cost
- position
- hands_to_blind_change
- hands_to_cap
training_signals: []
intervention: >-
  Let first-in aggression depend on forced cost per orbit computed from the live player count,
  so aggression rises as the table shrinks even at the same nominal level.
baseline: Hero-stack M computed for a full table.
mechanism: >-
  With fewer players the blinds come round faster, so the effective cost of waiting rises and
  steals gain value.
exceptions:
- Cap-time survival value, calling-heavy opponents or side-pot exposure.
- Variants where the candidate hand buckets have poor multiway equity.
variant_scope:
  transfer: generic
  variants: [all]
  notes: Forced-cost arithmetic transfers; hand buckets are supplied by the variant adapter.
