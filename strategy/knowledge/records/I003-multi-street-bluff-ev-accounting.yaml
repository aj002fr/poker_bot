id: I003
title: Multi-street bluff EV accounting
kind: invariant
status: proposed
cluster: invariant_math
sources:
- source: gtow-multistreet-bluffs
  location: Multi-street bluff article, line EV derivation and quiz
  digest_sections:
  - gtowizard-mpt.md multi-street bluff mathematics
  transfer_caveat: >-
    Pedagogical heads-up chip-EV model with dead called bluffs, fixed fold rates and no raises.
situation: A bluff line with bets on several streets and street-specific fold probabilities.
eligible_opportunity: Every full-line bluff EV computation.
observable_inputs: [pot, bet_size_pot_fraction, streets_remaining]
training_signals: []
intervention: >-
  Line EV equals the sum over streets of reach times fold probability times the pot before that
  bet, minus final reach times total bets; it must equal recursive enumeration, and the last-street
  break-even must solve EV = 0.
baseline: River-local break-even.
mechanism: Called earlier bets are sunk only after they are paid; later folds must repay them.
exceptions:
- Dead called bluffs with no equity; called equity requires the semi-bluff extension.
