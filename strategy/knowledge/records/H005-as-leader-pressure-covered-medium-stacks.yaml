id: H005
title: As leader, pressure covered medium stacks rather than the shortest stack
kind: strategy
status: proposed
cluster: points
sources:
- source: mit-15s50
  location: Lecture 5 ~19:53-27:34; slides pp. 70-77; Lecture 5
  digest_records: [mit15s50/H14, mit-l56/H4]
  transfer_caveat: >-
    Hold'em charts, M zones and cash-game statistics are examples; Lecture 4 explicitly ignores
    ICM.
situation: >-
  Hero covers the table, a covered medium stack acts behind, and at least one shorter stack remains.
eligible_opportunity: >-
  Unopened pot where hero is the chip leader and the next player to act is covered and not the
  shortest stack.
observable_inputs:
- stack_rank
- cover_relationships
- shortest_stack
- point_vector
- position
- opponent_posterior
- hands_to_cap
training_signals: []
intervention: >-
  Widen first-in pressure when the target is a covered medium stack, and do not widen equally
  against a desperate shortest stack.
baseline: Leader opening independent of the target's stack role.
mechanism: >-
  A covered medium stack loses more points from a confrontation and so should fold more; the shortest
  stack has less to protect and calls wider.
exceptions:
- Targets that ignore ICM pressure.
- Doubling up the nearest rival, or players behind with overcall risk.
variant_scope:
  transfer: generic
  variants: [all]
  notes: Stack-role logic transfers; hand selection for the widening is variant-specific.
