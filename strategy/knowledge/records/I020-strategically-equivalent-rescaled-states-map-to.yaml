intervention: >-
  Multiplying all stacks, bets and blinds by a constant leaves scale-normalised features, point
  thresholds and ICM shares unchanged.
baseline: Raw-amount features.
mechanism: Scale invariance of no-limit betting and ICM.
exceptions:
- >-
  Discrete minimum chip units and limit structures break exact invariance; tests use exact multiples.
