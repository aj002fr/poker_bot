baseline: Latest-only mirror self-play at equal games and updates.
mechanism: >-
  Mirror self-play can cycle or settle on brittle conventions; a league forces retention against
  earlier responses and diverse tables.
exceptions:
- A league can overfit its own registry and still miss novel styles.
