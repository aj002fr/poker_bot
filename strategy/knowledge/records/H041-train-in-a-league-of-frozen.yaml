situation: Iterative eight-player self-play without a convergence guarantee.
eligible_opportunity: Every training table; measured by cross-play and held-out families.
observable_inputs: [policy_table_key]
training_signals: [terminal_points]
intervention: >-
  Sample training lineups from the current policy, frozen checkpoints, style families and trained
