id: H046
title: Label decisions by counterfactual value, not realised results
kind: method
status: proposed
cluster: training
sources:
- source: mit-15s50
  location: Lecture 2 ~07:25-09:47; Lecture 2
  digest_records: [mit15s50/H06, mit-l12/H6]
  transfer_caveat: >-
    Hold'em charts, M zones and cash-game statistics are examples; Lecture 4 explicitly ignores
    ICM.
- source: harrington-v1
  location: Parts Five to Seven, pp. 97-172
  digest_records: [harrington/H32]
  transfer_caveat: >-
    Live nine/ten-handed NLHE with chip-EV reasoning, no ICM and no hand cap; frequencies and
    sizes are era-specific.
situation: Selecting and labelling self-play decisions for learning or review.
eligible_opportunity: Decision points where hero had a real choice (walks excluded).
observable_inputs: [legal_actions, hero_visible_history]
training_signals: [counterfactual_action_values, realized_outcome, rollout_return]
intervention: >-
  Train on estimated action values or regret, prioritise high-regret or uncertain decisions, and
  never label an action good because the runout won.
baseline: Labels from realised hand or SNG results.
mechanism: Realised cards are noisy labels and encourage hindsight leakage.
exceptions:
- >-
  Terminal points remain the evaluation target; deal-frequency checks remain useful for engine
  tests.
- Counterfactual evaluators can be biased; audit with exact small states.
