- source: harrington-v1
  location: Part Five, pp. 95-96
  digest_records: [harrington/H18]
  transfer_caveat: >-
    Live nine/ten-handed NLHE with chip-EV reasoning, no ICM and no hand cap; frequencies and
    sizes are era-specific.
situation: Deep early stack with a premium hand.
eligible_opportunity: Unopened preflop decision above the depth where a jam stops being standard.
observable_inputs:
- stack_bb
- opponent_posterior
- size_response_curve
- legal_size_bounds
- hand_bucket
training_signals: []
intervention: >-
  Prefer a smaller raise that attracts dominated continuations, unless measured call ranges favour
  the jam.
baseline: Jam allowed with premiums at any depth.
mechanism: >-
  A deep jam wins only the blinds and is called by a narrow range that is stronger than average.
exceptions:
- >-
  Loose jam callers, a severe positional disadvantage, or a small raise that already commits.
