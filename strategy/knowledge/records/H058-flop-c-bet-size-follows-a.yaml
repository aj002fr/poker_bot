situation: >-
  Choosing a flop c-bet size across dry, dynamic, nut-saturated, connected and paired boards.
eligible_opportunity: Heads-up flop c-bet decision.
observable_inputs:
- board_texture_class
- field_nut_mass
- middle_range_mass
- weighted_denial
- nut_advantage
- blocker_mask
- spr
training_signals: []
intervention: >-
  Let size move small on dry or paired boards, larger on dynamic boards where hero holds a nut
  edge, and back to checks or small bets on nut-saturated boards.
baseline: One size for all textures.
mechanism: >-
  Denial value peaks on dynamic boards before current nut saturation; paired boards contain many
  cheap folds; saturated boards leave a strong continuing range.
exceptions:
- >-
  Extreme action-conditioned range or nut asymmetry, multiway pots, or nonstandard preflop ranges.
