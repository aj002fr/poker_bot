intervention: >-
  Keep price, leverage, position, belief and tournament layers fixed and retrain only card-specific
  equity and texture components.
baseline: Reuse the whole Hold'em policy, or rebuild from scratch.
mechanism: Betting arithmetic generalises while starting hands and draw structure do not.
exceptions:
- Variants with materially different betting or showdown rules.
