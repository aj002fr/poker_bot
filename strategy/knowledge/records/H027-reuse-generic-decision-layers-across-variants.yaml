  digest_records: [harrington/H29]
  transfer_caveat: >-
    Live nine/ten-handed NLHE with chip-EV reasoning, no ICM and no hand cap; frequencies and
    sizes are era-specific.
situation: The revealed game differs from Hold'em.
eligible_opportunity: Every decision in a non-NLHE variant.
