id: H071
title: Bet the river for value only with enough worse-call mass
kind: strategy
status: proposed
cluster: postflop_river
sources:
- source: harrington-v1
  location: Part Seven, p. 160
  digest_records: [harrington/H25]
  transfer_caveat: >-
    Live nine/ten-handed NLHE with chip-EV reasoning, no ICM and no hand cap; frequencies and
    sizes are era-specific.
situation: A marginal made hand reaches the river.
eligible_opportunity: River value-bet decision with a medium-strength hand.
observable_inputs:
- opponent_range_summary
- own_range_rank
- bet_size_pot_fraction
- size_response_curve
training_signals: []
intervention: >-
  Require positive value against the estimated calling range (worse hands that call versus better
  hands that call or raise) before betting.
baseline: Bet whenever the hand is likely best.
mechanism: River bets have no protection value; if only better hands call, betting loses.
exceptions:
- Converting the hand into a profitable bluff.
