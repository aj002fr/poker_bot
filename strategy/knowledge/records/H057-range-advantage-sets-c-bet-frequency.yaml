id: H057
title: Range advantage sets c-bet frequency, nut advantage sets size
kind: strategy
status: proposed
cluster: postflop_flop
sources:
- source: gtow-cbet-sizing
  location: C-bet sizing, overview
  digest_records: [gtow/H01]
  transfer_caveat: Heads-up 100bb cash NLHE solver outputs without ICM.
situation: Heads-up flop after hero was the preflop aggressor.
eligible_opportunity: Heads-up flop decision for the preflop raiser facing a check or acting first.
observable_inputs: [range_advantage, nut_advantage, spr, position, board_texture_class]
training_signals: []
intervention: >-
  Drive betting frequency from average range advantage and bet size from top-of-range (nut) advantage,
  as separate inputs.
baseline: One combined board-strength score for both.
mechanism: >-
  Average strength and ownership of the strongest hands affect different parts of the strategy.
exceptions:
- Shallow all-in geometry, multiway pots, or a high ICM risk premium.
