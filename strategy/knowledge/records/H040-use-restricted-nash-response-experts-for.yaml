id: H040
title: Use restricted Nash response experts for archetype exploitation
kind: method
status: proposed
cluster: exploitation
sources:
- source: johanson-rnr-2007
  location: Johanson, Zinkevich and Bowling 2007
  digest_records: [cfr/H7]
  transfer_caveat: The safety theorem is two-player zero-sum and the opponent models used millions
    of hands.
situation: Population statistics suggest an opponent archetype but the model is uncertain.
eligible_opportunity: Decisions against an opponent whose archetype posterior exceeds the gate.
observable_inputs:
- archetype_posterior
- posterior_effective_sample_size
- policy_distribution
training_signals: [opponent_family_label]
intervention: >-
  Train restricted-response experts per archetype offline at several restriction probabilities
  and select from a held-out Pareto frontier.
baseline: Pure best response, and the robust baseline.
mechanism: Small sacrifices in modelled gain sharply cut losses when the model is wrong.
exceptions:
- The safety theorem is two-player zero-sum; eight-player benefit is empirical.
