id: H024
title: Share one policy conditioned on seat, position and players behind
kind: strategy
status: proposed
cluster: state_features
sources:
- source: harrington-v1
  location: Part One pp. 12-17; Part Five pp. 81-90
  digest_records: [harrington/H04]
  transfer_caveat: >-
    Live nine/ten-handed NLHE with chip-EV reasoning, no ICM and no hand cap; frequencies and
    sizes are era-specific.
- source: mit-15s50
  location: Lecture 7
  digest_records: [mit-l78/H9]
  transfer_caveat: >-
    Hold'em charts, M zones and cash-game statistics are examples; Lecture 4 explicitly ignores
    ICM.
situation: Marginal hands first in or facing action at different seats.
eligible_opportunity: Any preflop decision; compared by policy structure.
observable_inputs:
- seat
- position
- relative_position
- players_to_act
- blind_vs_blind
- stack_bb
training_signals: []
intervention: >-
  Use one shared policy with position, players-behind and interaction terms rather than an unconditioned
  shared policy or separate per-seat policies.
baseline: Shared policy without seat conditioning.
mechanism: >-
  Position value depends on later information and on how many players can still resist; sharing
  keeps data efficiency and model size.
exceptions:
- ICM pressure, short re-shove stacks or aggressive blinds can override positional widening.
variant_scope:
  transfer: generic
  variants: [all]
  notes: Structural for any seated game.
