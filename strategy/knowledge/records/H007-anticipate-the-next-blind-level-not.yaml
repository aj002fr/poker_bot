id: H007
title: Anticipate the next blind level, not just the current one
kind: strategy
status: proposed
cluster: tournament_clock
sources:
- source: mit-15s50
  location: Lecture 5 ~06:46-14:00; Lecture 5 stack zones
  digest_records: [mit15s50/H16, mit-l56/H6]
  transfer_caveat: >-
    Hold'em charts, M zones and cash-game statistics are examples; Lecture 4 explicitly ignores
    ICM.
situation: The table is a few hands from a scheduled blind increase.
eligible_opportunity: Decisions within one orbit before a level change, compared with the same
  depth mid-level.
observable_inputs:
- hands_to_blind_change
- next_forced_bets
- forced_bets
- stack_bb
- m_ratio
- position
- stack_vector
training_signals: []
intervention: >-
  Feed projected next-level depth and hands to the change so aggression and waiting reflect where
  the stack will stand after the increase.
baseline: Current blind level only.
mechanism: >-
  A stack's fold equity and purchasing power drop discontinuously at the next level, so the last
  orbit before it has different value.
exceptions:
- >-
  Unknown future blind amounts must not be guessed; the feature is off until the official schedule
  is loaded.
