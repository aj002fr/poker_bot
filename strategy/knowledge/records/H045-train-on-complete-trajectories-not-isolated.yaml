id: H045
title: Train on complete trajectories, not isolated streets
kind: method
status: proposed
cluster: training
sources:
- source: mop
  location: chs. 19-20, pp. 228-258
  digest_records: [mop/H16]
  transfer_caveat: >-
    Toy-game solutions are exact only under their stated assumptions; hold'em charts and the doubling-up
    model do not transfer to an eight-bot points SNG.
situation: Any node with future betting.
eligible_opportunity: Every multi-street training trajectory.
observable_inputs:
- action_history
- own_range_summary
- opponent_range_summary
- streets_remaining
training_signals: [reach_probabilities, terminal_points]
intervention: >-
  Propagate terminal value through the whole trajectory and preserve range reach across streets.
baseline: Independent street policies with per-street targets.
mechanism: >-
  Earlier costs and range selection change later bluff and defence frequencies; chaining street
  solutions gives wrong answers.
exceptions: [Genuinely terminal subgames.]
variant_scope:
  transfer: generic
  variants: [all]
  notes: Trainer-level.
