id: H009
title: Act before projected forced costs remove fold equity
kind: strategy
status: proposed
cluster: stack_pressure
sources:
- source: mit-15s50
  location: Lecture 5 ~08:11-11:12; slides pp. 10-11; Lecture 5 stack zones
  digest_records: [mit15s50/H13, mit-l56/H3]
  transfer_caveat: >-
    Hold'em charts, M zones and cash-game statistics are examples; Lecture 4 explicitly ignores
    ICM.
situation: A short stack will soon post blinds or cross the depth where opens stop inducing folds.
eligible_opportunity: >-
  First-in decision when projected forced costs before the next favourable position would leave
  hero below the urgency depth.
observable_inputs:
- hero_stack
- stack_bb
- projected_forced_cost
- hands_to_blind_change
- position
- opponent_posterior
- point_vector
training_signals: []
intervention: >-
  Increase first-in aggression in proportion to how much projected forced costs will erode fold
  equity before the next good opportunity.
baseline: Aggression conditioned on current depth only.
mechanism: Waiting converts a shove that sometimes wins uncontested into a near-forced showdown.
exceptions:
- A shorter stack is likely to bust first.
- Cap survival dominates, or better positions are imminent.
