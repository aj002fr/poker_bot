  digest_records: [gtow/H24]
  transfer_caveat: >-
    Partly a product announcement; ordinary payout ICM is not the competition's hand-200 allocation.
situation: >-
  Effective stack roughly 5-18 big blinds, unopened or blind versus blind, with covering stacks
  behind.
eligible_opportunity: Unopened or blind-versus-blind preflop decision at medium-short effective
  depth.
observable_inputs:
- stack_bb
- m_ratio
- effective_stack_by_opponent
- cover_relationships
- legal_size_bounds
- position
- blind_vs_blind
- point_vector
- hand_bucket
training_signals: []
intervention: >-
  Include limp and small-raise branches in offline solving before any pruning to fold or jam.
baseline: Forced shove-or-fold below the depth threshold.
mechanism: >-
  Small raises can keep dominated hands in, induce errors, and let a non-shortest stack fold to
  a narrow re-jam under ICM.
exceptions:
- Limit structures or variants without those actions.
- Evidence that the extra branches carry negligible value or destabilise off-tree play.
