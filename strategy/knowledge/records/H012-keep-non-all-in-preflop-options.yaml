id: H012
title: Keep non-all-in preflop options at medium-short depth
kind: strategy
status: proposed
cluster: preflop_tree
sources:
- source: mit-15s50
  location: Lecture 4 ~21:42-23:54; slides pp. 35-36; Lecture 4 ~21:42-23:54; Lectures 5-6
  digest_records: [mit15s50/H11, mit-l34/H8, mit-l56/H10]
