# Every numbered hypothesis in the project-store reading digests (internal/reading/...).
# Titles are short paraphrases; `location` is the original source location the digest
# cites. The linter requires each key to be cited by at least one record, so nothing
# extracted from a source is silently dropped during deduplication.
# data-and-rules.md has no numbered hypotheses; records cite its sections instead.

