schema: knowledge.experiment/v1
id: E027
title: 'Surprise-variant rehearsal: generic-layer transfer and staged reveal-day pipeline'
kind: rehearsal
mode: discovery
records: [H027, H055]
question: >-
  With generic layers frozen, how much point loss transfers to short deck and PLO before and after
  adapter retraining, and how does artifact quality grow minute by minute in a blind 60-minute
  rehearsal?
arms:
- name: holdem_reuse
  role: control
  description: Hold'em policy reused under the new rules with only legality adaptation.
  toggles:
    transfer_mode: reuse
- name: generic_first
  role: treatment
  description: Generic evaluator-driven policy submitted first.
  toggles:
    transfer_mode: generic_first
- name: staged
  role: treatment
  description: Generic first, then endgame tables, then a coarse blueprint.
  toggles:
    transfer_mode: staged
factors: []
toggles:
  transfer_mode: [reuse, generic_first, staged]
lineups:
  train:
    population: train
    families: all train families
    checkpoints: frozen only
  evaluate:
    population: validation
    families: all validation families plus the six arena style anchors
    candidate_seats_per_table: 1
variants:
  primary: [short_deck, plo]
  rehearsal: [limit_holdem]
seeds:
  namespace: knowledge/E027
  pilot_blocks: 100
  rotation: every entrant through all eight seats
  streams: separate environment and per-seat policy RNG streams (common random numbers)
design:
  unit: paired seed/lineup/rotation block
  interval: paired t 95%; cluster bootstrap over blocks when skewed
  sample_size: N ~ 7.84 sigma_D^2 / delta^2 from a pilot of 100 blocks; no peeking
  multiplicity: Holm across the M1-M3 discovery screen
primary_metric: transfer_point_loss
minimum_effect:
  value: 0.004
  unit: pool_fraction_per_sng
  basis: provisional
metrics: [artifact_quality_curve, mean_point_delta]
slices: [variant, minute of build phase, adapter retrained vs not]
guardrails:
- every intermediate artifact passes legality and latency gates before submission
- >-
  worst_family_point_delta not below -0.01 pool fraction per SNG (provisional; plan open decision
  2)
- zero illegal actions, timeouts and fallback actions on the deployed path
- decision latency p99 and p99.9 within the sandbox budget
partitions:
  fit: train
  screen: validation/screen
  confirm: validation/confirm
  final_holdout: excluded
budget:
  cpu_core_hours: 60
gates:
  promote: >-
    screen: 95% interval excludes 0 in the favourable direction after Holm; confirm: same on validation/confirm
    with the effect at least the minimum effect
  reject: 95% interval on the screen excludes the minimum effect in the favourable direction
  execution:
    illegal_actions: 0
    timeouts: 0
    decision_latency_p99_ms: 1.0
    artifact_mb_max: 100
blocked_by: [M9 rehearsal tooling, variant adapters for short deck and PLO]
status: blocked
result_artifact: null
