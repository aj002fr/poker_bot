schema: knowledge.experiment/v1
id: E005
title: 'Short-stack urgency: forced-bet pressure, fold-equity preservation, soft gates'
kind: factorial
mode: discovery
records: [H008, H009, H010]
question: >-
  Do orbit-corrected forced-cost features, projected-cost urgency and soft regime gates improve
  points from short-stack states, and are hard thresholds worse than learned soft gates?
arms:
- name: hero_m
  role: control
  description: Hero-stack M only; no orbit correction or projection.
  toggles:
    orbit_correction: 'off'
    projected_cost: 'off'
    regime_gate: none
- name: orbit
  role: treatment
  description: Adds players-remaining orbit correction.
  toggles:
    orbit_correction: 'on'
    projected_cost: 'off'
    regime_gate: none
- name: projection
  role: treatment
  description: Adds forced cost projected to the next favourable position.
  toggles:
    orbit_correction: 'on'
    projected_cost: 'on'
    regime_gate: none
- name: hard_gate
  role: treatment
  description: Adds fixed-threshold regimes swept over a declared grid.
  toggles:
    orbit_correction: 'on'
    projected_cost: 'on'
    regime_gate: hard
- name: soft_gate
  role: treatment
  description: Adds learned smooth gates.
  toggles:
    orbit_correction: 'on'
    projected_cost: 'on'
    regime_gate: soft
factors:
- name: orbit correction
  toggle: orbit_correction
  records_tested: [H008]
- name: projected cost
  toggle: projected_cost
  records_tested: [H009]
- name: regime gate
  toggle: regime_gate
  records_tested: [H010]
toggles:
  orbit_correction: ['off', 'on']
  projected_cost: ['off', 'on']
  regime_gate: [none, hard, soft]
lineups:
  train:
    population: train
    families: all train families
    checkpoints: frozen only
  evaluate:
    population: validation
    families: all validation families plus the six arena style anchors
    candidate_seats_per_table: 1
variants:
  primary: [nlhe]
  rehearsal: [short_deck, plo]
seeds:
  namespace: knowledge/E005
  pilot_blocks: 100
  rotation: every entrant through all eight seats
  streams: separate environment and per-seat policy RNG streams (common random numbers)
design:
  unit: paired seed/lineup/rotation block
  interval: paired t 95%; cluster bootstrap over blocks when skewed
  sample_size: N ~ 7.84 sigma_D^2 / delta^2 from a pilot of 100 blocks; no peeking
  multiplicity: Holm across the M1-M3 discovery screen
primary_metric: slice_point_delta
minimum_effect:
  value: 0.004
  unit: pool_fraction_per_sng
  basis: provisional
metrics: [mean_point_delta]
slices:
- states entered at 3-8 big blinds
- three- to five-handed
- uncontested-win rate
- forced-call rate
- bust timing
guardrails:
- >-
  worst_family_point_delta not below -0.01 pool fraction per SNG (provisional; plan open decision
  2)
- zero illegal actions, timeouts and fallback actions on the deployed path
- decision latency p99 and p99.9 within the sandbox budget
partitions:
  fit: train
  screen: validation/screen
  confirm: validation/confirm
  final_holdout: excluded
budget:
  cpu_core_hours: 120
gates:
  promote: >-
    screen: 95% interval excludes 0 in the favourable direction after Holm; confirm: same on validation/confirm
    with the effect at least the minimum effect
  reject: 95% interval on the screen excludes the minimum effect in the favourable direction
  execution:
    illegal_actions: 0
    timeouts: 0
    decision_latency_p99_ms: 1.0
    artifact_mb_max: 100
blocked_by: [M3-A feature layer, M3-B learner]
status: blocked
result_artifact: null
