schema: knowledge.experiment/v1
id: E025
title: Mixed sampling, balanced range construction and own-range features
kind: factorial
mode: discovery
records: [H050, H051, H052]
question: >-
  Do seeded mixed actions, shared size buckets across hand classes and own-range features reduce
  exploitability by trained responses without losing population points?
arms:
- name: argmax
  role: control
  description: Deterministic argmax, hand-class-specific sizes, current-hand features.
  toggles:
    action_sampling: argmax
    size_sharing: segregated
    range_features: 'off'
- name: mixed
  role: treatment
  description: Seeded sampling from the mixed policy.
  toggles:
    action_sampling: mixed
    size_sharing: segregated
    range_features: 'off'
- name: mixed_shared
  role: treatment
  description: Mixed sampling with shared size buckets.
  toggles:
    action_sampling: mixed
    size_sharing: shared
    range_features: 'off'
- name: mixed_shared_range
  role: treatment
  description: Adds own-range rank and opponent range summaries.
  toggles:
    action_sampling: mixed
    size_sharing: shared
    range_features: 'on'
factors:
- name: action sampling
  toggle: action_sampling
  records_tested: [H050]
- name: size sharing
  toggle: size_sharing
  records_tested: [H051]
- name: range features
  toggle: range_features
  records_tested: [H052]
toggles:
  action_sampling: [argmax, mixed]
  size_sharing: [segregated, shared]
  range_features: ['off', 'on']
lineups:
  train:
    population: train
    families: all train families
    checkpoints: frozen only
  evaluate:
    population: validation
    families: all validation families plus the six arena style anchors
    candidate_seats_per_table: 1
variants:
  primary: [nlhe]
  rehearsal: [short_deck, plo]
seeds:
  namespace: knowledge/E025
  pilot_blocks: 100
  rotation: every entrant through all eight seats
  streams: separate environment and per-seat policy RNG streams (common random numbers)
design:
  unit: paired seed/lineup/rotation block
  interval: paired t 95%; cluster bootstrap over blocks when skewed
  sample_size: N ~ 7.84 sigma_D^2 / delta^2 from a pilot of 100 blocks; no peeking
  multiplicity: Holm across the M1-M3 discovery screen
primary_metric: approximate_response_loss
minimum_effect:
  value: 0.004
  unit: pool_fraction_per_sng
  basis: provisional
metrics: [mean_point_delta]
slices:
- image-responsive opponents
- trained approximate responses
- river nodes
guardrails:
- >-
  worst_family_point_delta not below -0.01 pool fraction per SNG (provisional; plan open decision
  2)
- zero illegal actions, timeouts and fallback actions on the deployed path
- decision latency p99 and p99.9 within the sandbox budget
partitions:
  fit: train
  screen: validation/screen
  confirm: validation/confirm
  final_holdout: excluded
budget:
  cpu_core_hours: 200
gates:
  promote: >-
    screen: 95% interval excludes 0 in the favourable direction after Holm; confirm: same on validation/confirm
    with the effect at least the minimum effect
  reject: 95% interval on the screen excludes the minimum effect in the favourable direction
  execution:
    illegal_actions: 0
    timeouts: 0
    decision_latency_p99_ms: 1.0
    artifact_mb_max: 100
blocked_by: [M5 blueprint, trained approximate responses]
status: blocked
result_artifact: null
