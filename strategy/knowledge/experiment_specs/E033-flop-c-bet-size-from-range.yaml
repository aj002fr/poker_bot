schema: knowledge.experiment/v1
id: E033
title: Flop c-bet size from range/nut advantage, texture and weighted denial
kind: factorial
mode: discovery
records: [H057, H058, H059, H060]
question: >-
  Do separate frequency and size drivers (range vs nut advantage), a texture curve, weighted denial
  and texture-gated geometric sizing improve heads-up flop play over one board-strength score?
arms:
- name: single_score
  role: control
  description: One board-strength score sets frequency and size.
  toggles:
    advantage_split: 'off'
    texture_curve: 'off'
    denial_weighting: 'off'
    geometric_prior: 'off'
- name: split
  role: treatment
  description: Range advantage drives frequency, nut advantage drives size.
  toggles:
    advantage_split: 'on'
    texture_curve: 'off'
    denial_weighting: 'off'
    geometric_prior: 'off'
- name: split_texture_denial
  role: treatment
  description: Adds the texture curve and weighted denial.
  toggles:
    advantage_split: 'on'
    texture_curve: 'on'
    denial_weighting: 'on'
    geometric_prior: 'off'
- name: all
  role: treatment
  description: Adds a texture-gated geometric prior.
  toggles:
    advantage_split: 'on'
    texture_curve: 'on'
    denial_weighting: 'on'
    geometric_prior: 'on'
factors:
- name: advantage split
  toggle: advantage_split
  records_tested: [H057]
- name: texture curve
  toggle: texture_curve
  records_tested: [H058]
- name: denial weighting
  toggle: denial_weighting
  records_tested: [H059]
- name: geometric prior
  toggle: geometric_prior
  records_tested: [H060]
toggles:
  advantage_split: ['off', 'on']
  texture_curve: ['off', 'on']
  denial_weighting: ['off', 'on']
  geometric_prior: ['off', 'on']
lineups:
  train:
    population: train
    families: all train families
    checkpoints: frozen only
  evaluate:
    population: validation
    families: all validation families plus the six arena style anchors
    candidate_seats_per_table: 1
variants:
  primary: [nlhe]
  rehearsal: []
seeds:
  namespace: knowledge/E033
  pilot_blocks: 100
  rotation: every entrant through all eight seats
  streams: separate environment and per-seat policy RNG streams (common random numbers)
design:
  unit: paired seed/lineup/rotation block
  interval: paired t 95%; cluster bootstrap over blocks when skewed
  sample_size: N ~ 7.84 sigma_D^2 / delta^2 from a pilot of 100 blocks; no peeking
  multiplicity: Holm across the M1-M3 discovery screen
primary_metric: slice_point_delta
minimum_effect:
  value: 0.004
  unit: pool_fraction_per_sng
  basis: provisional
metrics: [mean_point_delta, approximate_response_loss]
slices: [heads-up flops, board texture class, SPR bucket]
guardrails:
- >-
  worst_family_point_delta not below -0.01 pool fraction per SNG (provisional; plan open decision
  2)
- zero illegal actions, timeouts and fallback actions on the deployed path
- decision latency p99 and p99.9 within the sandbox budget
partitions:
  fit: train
  screen: validation/screen
  confirm: validation/confirm
  final_holdout: excluded
budget:
  cpu_core_hours: 300
gates:
  promote: >-
    screen: 95% interval excludes 0 in the favourable direction after Holm; confirm: same on validation/confirm
    with the effect at least the minimum effect
  reject: 95% interval on the screen excludes the minimum effect in the favourable direction
  execution:
    illegal_actions: 0
    timeouts: 0
    decision_latency_p99_ms: 1.0
    artifact_mb_max: 100
blocked_by: [M5 blueprint, E014 buckets]
status: blocked
result_artifact: null
