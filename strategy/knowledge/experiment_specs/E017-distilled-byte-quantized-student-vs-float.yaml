schema: knowledge.experiment/v1
id: E017
title: Distilled, byte-quantized student vs float teacher
kind: factorial
mode: discovery
records: [H053, H054]
question: >-
  Can a lookup or shallow student with byte-quantized probabilities match the float teacher in
  points within the latency and size limits?
arms:
- name: teacher
  role: control
  description: Float teacher policy (offline reference).
  toggles:
    student: teacher
    quantization: float
- name: lookup_float
  role: treatment
  description: Lookup-table student, float probabilities.
  toggles:
    student: lookup
    quantization: float
- name: lookup_byte
  role: treatment
  description: Lookup-table student, bytes summing to 255.
  toggles:
    student: lookup
    quantization: byte
- name: shallow_byte
  role: treatment
  description: Quantized shallow model student.
  toggles:
    student: shallow_model
    quantization: byte
factors:
- name: student form
  toggle: student
  records_tested: [H053]
- name: quantization
  toggle: quantization
  records_tested: [H054]
toggles:
  student: [teacher, lookup, shallow_model]
  quantization: [float, byte]
lineups:
  train:
    population: train
    families: all train families
    checkpoints: frozen only
  evaluate:
    population: validation
    families: all validation families plus the six arena style anchors
    candidate_seats_per_table: 1
variants:
  primary: [nlhe]
  rehearsal: [short_deck, plo]
seeds:
  namespace: knowledge/E017
  pilot_blocks: 100
  rotation: every entrant through all eight seats
  streams: separate environment and per-seat policy RNG streams (common random numbers)
design:
  unit: paired seed/lineup/rotation block
  interval: paired t 95%; cluster bootstrap over blocks when skewed
  sample_size: N ~ 7.84 sigma_D^2 / delta^2 from a pilot of 100 blocks; no peeking
  multiplicity: Holm across the M1-M3 discovery screen
primary_metric: teacher_student_kl
minimum_effect:
  value: 0.02
  unit: nats_per_decision
  basis: provisional
metrics: [mean_point_delta, approximate_response_loss]
slices:
- low-probability actions (teacher p < 0.05)
- street
- stack bucket
guardrails:
- 'point noninferiority: 95% interval lower bound above -0.004 against the teacher'
- artifact under 80 MB working target
- >-
  worst_family_point_delta not below -0.01 pool fraction per SNG (provisional; plan open decision
  2)
- zero illegal actions, timeouts and fallback actions on the deployed path
- decision latency p99 and p99.9 within the sandbox budget
partitions:
  fit: train
  screen: validation/screen
  confirm: validation/confirm
  final_holdout: excluded
budget:
  cpu_core_hours: 100
gates:
  promote: >-
    screen: 95% interval excludes 0 in the favourable direction after Holm; confirm: same on validation/confirm
    with the effect at least the minimum effect
  reject: 95% interval on the screen excludes the minimum effect in the favourable direction
  execution:
    illegal_actions: 0
    timeouts: 0
    decision_latency_p99_ms: 1.0
    artifact_mb_max: 100
blocked_by: [M8 distillation, T017 byte-table tests]
status: blocked
result_artifact: null
