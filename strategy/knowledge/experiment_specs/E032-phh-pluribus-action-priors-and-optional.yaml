schema: knowledge.experiment/v1
id: E032
title: PHH Pluribus action priors and optional behaviour-cloning prior
kind: factorial
mode: discovery
records: [H038, H047]
question: >-
  Do PHH-derived action-frequency priors improve sparse-evidence belief calibration, and does
  a behaviour-cloning prior help the learner without leaking?
arms:
- name: population_prior
  role: control
  description: Priors from the arena population only; no BC.
  toggles:
    phh_prior: 'off'
    bc_prior: 'off'
- name: phh_belief_prior
  role: treatment
  description: PHH frequencies as hierarchical belief priors.
  toggles:
    phh_prior: 'on'
    bc_prior: 'off'
- name: phh_bc
  role: treatment
  description: Adds a decaying behaviour-cloning prior on the policy.
  toggles:
    phh_prior: 'on'
    bc_prior: 'on'
factors:
- name: PHH belief prior
  toggle: phh_prior
  records_tested: [H038]
- name: BC prior
  toggle: bc_prior
  records_tested: [H047]
toggles:
  phh_prior: ['off', 'on']
  bc_prior: ['off', 'on']
lineups:
  train:
    population: train
    families: all train families
    checkpoints: frozen only
  evaluate:
    population: validation
    families: all validation families plus the six arena style anchors
    candidate_seats_per_table: 1
variants:
  primary: [nlhe]
  rehearsal: []
seeds:
  namespace: knowledge/E032
  pilot_blocks: 100
  rotation: every entrant through all eight seats
  streams: separate environment and per-seat policy RNG streams (common random numbers)
design:
  unit: complete held-out SNG (decisions clustered within it)
  interval: cluster bootstrap 95% over SNGs
  sample_size: N ~ 7.84 sigma_D^2 / delta^2 from a 100-SNG pilot
  multiplicity: Holm across the M1-M3 discovery screen
primary_metric: held_out_action_log_loss
minimum_effect:
  value: 0.01
  unit: nats_per_opportunity
  basis: provisional
metrics: [mean_point_difference]
slices: [early table hands, six-max-like states, deep stacks]
guardrails:
- information-set freeze (T015) passes on every imported row
- PHH import counts (T016) match
- >-
  worst_family_point_delta not below -0.01 pool fraction per SNG (provisional; plan open decision
  2)
- zero illegal actions, timeouts and fallback actions on the deployed path
- decision latency p99 and p99.9 within the sandbox budget
partitions:
  fit: train
  screen: validation/screen
  confirm: validation/confirm
  final_holdout: excluded
budget:
  cpu_core_hours: 80
gates:
  promote: >-
    screen: 95% interval excludes 0 in the favourable direction after Holm; confirm: same on validation/confirm
    with the effect at least the minimum effect
  reject: 95% interval on the screen excludes the minimum effect in the favourable direction
  execution:
    illegal_actions: 0
    timeouts: 0
    decision_latency_p99_ms: 1.0
    artifact_mb_max: 100
run_specs: []
blocked_by: [T015 and T016, user decision 6 on BC funding]
status: blocked
result_artifact: null
