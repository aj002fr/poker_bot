schema: knowledge.experiment/v1
id: E004
title: 'Tournament clock: cap horizon and blind transitions'
kind: factorial
mode: discovery
records: [H006, H007]
question: >-
  Do hands-to-cap and hands-to-next-level features improve held-out points, especially in the
  last 25 hands and around level changes?
arms:
- name: no_clock
  role: control
  description: Current blinds and stacks only.
  toggles:
    cap_horizon: 'off'
    blind_transition: 'off'
- name: cap
  role: treatment
  description: Adds hand number and hands to cap.
  toggles:
    cap_horizon: 'on'
    blind_transition: 'off'
- name: transition
  role: treatment
  description: Adds hands to the next level and the projected next-level depth.
  toggles:
    cap_horizon: 'off'
    blind_transition: 'on'
- name: both
  role: treatment
  description: Both clock feature groups.
  toggles:
    cap_horizon: 'on'
    blind_transition: 'on'
factors:
- name: cap horizon
  toggle: cap_horizon
  records_tested: [H006]
- name: blind transition
  toggle: blind_transition
  records_tested: [H007]
toggles:
  cap_horizon: ['off', 'on']
  blind_transition: ['off', 'on']
lineups:
  train:
    population: train
    families: all train families
    checkpoints: frozen only
  evaluate:
    population: validation
    families: all validation families plus the six arena style anchors
    candidate_seats_per_table: 1
variants:
  primary: [nlhe]
  rehearsal: [short_deck, plo]
seeds:
  namespace: knowledge/E004
  pilot_blocks: 100
  rotation: every entrant through all eight seats
  streams: separate environment and per-seat policy RNG streams (common random numbers)
design:
  unit: paired seed/lineup/rotation block
  interval: paired t 95%; cluster bootstrap over blocks when skewed
  sample_size: N ~ 7.84 sigma_D^2 / delta^2 from a pilot of 100 blocks; no peeking
  multiplicity: Holm across the M1-M3 discovery screen
primary_metric: mean_point_difference
minimum_effect:
  value: 0.004
  unit: pool_fraction_per_sng
  basis: provisional
metrics: [slice_point_delta]
slices:
- opponent_family
- seat
- survivor_count
- blind_phase
- hand_quartile
- 'hands_to_cap: 50/25/10/5'
- five hands before and after each level change
guardrails:
- >-
  worst_family_point_delta not below -0.01 pool fraction per SNG (provisional; plan open decision
  2)
- zero illegal actions, timeouts and fallback actions on the deployed path
- decision latency p99 and p99.9 within the sandbox budget
partitions:
  fit: train
  screen: validation/screen
  confirm: validation/confirm
  final_holdout: excluded
budget:
  cpu_core_hours: 150
gates:
  promote: >-
    screen: 95% interval excludes 0 in the favourable direction after Holm; confirm: same on validation/confirm
    with the effect at least the minimum effect
  reject: 95% interval on the screen excludes the minimum effect in the favourable direction
  execution:
    illegal_actions: 0
    timeouts: 0
    decision_latency_p99_ms: 1.0
    artifact_mb_max: 100
run_specs: []
blocked_by:
- M3-A feature layer
- official blind schedule (organizer question)
status: blocked
result_artifact: null
